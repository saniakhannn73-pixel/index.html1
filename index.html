<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Birthday Surprise</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sky1:#ffd9ea;--sky2:#e3d8fb;--card:rgba(255,255,255,.78);--ink:#4a2c6b;--soft:#7d6498;--btn:#d6559b;--btnt:#fff;--ring:#4a2c6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--sky1:#2b1b4d;--sky2:#14143a;--card:rgba(255,255,255,.09);--ink:#f6e8ff;--soft:#c3acdf;--btn:#ff8fc4;--btnt:#2b1b4d;--ring:#ffd1ea}}
:root[data-theme="dark"]{color-scheme:dark;--sky1:#2b1b4d;--sky2:#14143a;--card:rgba(255,255,255,.09);--ink:#f6e8ff;--soft:#c3acdf;--btn:#ff8fc4;--btnt:#2b1b4d;--ring:#ffd1ea}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--sky1),var(--sky2));background-attachment:fixed;color:var(--ink);font-family:"Nunito","Trebuchet MS",sans-serif;font-weight:600;font-size:17px;display:flex;justify-content:center;padding:20px 16px;overflow-x:hidden}
main{width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column}
h1,h2,p{margin:0}
h1{font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;font-size:38px;line-height:1.3;margin:14px 0 8px}
.sub{color:var(--soft);font-size:16px;line-height:1.5}
.card{background:var(--card);border-radius:22px;padding:18px;margin-top:18px;backdrop-filter:blur(6px)}
button.main{font:inherit;font-weight:800;font-size:18px;background:var(--btn);color:var(--btnt);border:0;border-radius:999px;padding:13px 28px;margin-top:18px;cursor:pointer}
button.main[disabled]{opacity:.35;cursor:default}
button:focus-visible,.bl:focus-visible,svg.tap:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 6px;margin-top:20px}
.bl{background:none;border:0;padding:0;cursor:pointer;animation:bob 3s ease-in-out infinite alternate;transition:transform .3s,opacity .3s}
.bl:nth-child(2n){animation-delay:-1s}.bl:nth-child(3n){animation-delay:-2s}
.bl svg{width:78px;height:112px;display:block;margin:0 auto}
.bl.popped{transform:scale(1.5);opacity:0;pointer-events:none;animation:none}
@keyframes bob{to{transform:translateY(-10px) rotate(2deg)}}
.wish{min-height:92px;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1.5;font-weight:800}
.tap{width:230px;height:230px;display:block;margin:14px auto 0;cursor:pointer}
.lid{transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.open .lid{transform:translate(8px,-46px) rotate(14deg)}
.gift{animation:bob 2.2s ease-in-out infinite alternate}
.open .gift{animation:none}
.walls{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;margin-top:20px}
.pol{background:#fff;padding:7px 7px 8px;border-radius:4px;box-shadow:0 6px 16px rgba(60,20,90,.25);transform:rotate(var(--r));color:#6b4a86;font-family:"Pacifico","Brush Script MT",cursive;font-size:15px;line-height:1.3}
.pol img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px;margin-bottom:6px}
.ring{width:132px;height:132px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:5px solid #fff;box-shadow:0 6px 18px rgba(60,20,90,.3);margin:6px auto 0;display:block}
.flame{transform-origin:100px 52px;animation:fl .5s ease-in-out infinite alternate}
.off .flame{display:none}
@keyframes fl{to{transform:scale(1.12,.92) rotate(3deg)}}
.mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:6;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;backdrop-filter:blur(6px)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){.bl,.flame,.gift{animation:none}.bl,.lid{transition:none}}
</style>
</head>

<main id="app"></main>

var caps=["Pretty as a picture","That calm smile","Pure sunshine","Always graceful"];
var tilt=["-3deg","2.5deg","2deg","-2.5deg"];
var pos=["50% 25%","50% 25%","50% 20%","50% 22%"];
var wishes=[
"May your day be as bright as your smile.",
"Thank you for being the friend who always understands.",
"Wishing you laughter that makes your cheeks hurt.",
"May every dream you are quietly chasing come true this year.",
"You make ordinary days feel special. Never change.",
"Here is to more adventures, more memories and a lot more cake."];
var cols=[["#ff7eb6","#d6559b"],["#ffb86b","#f08a3c"],["#7ed6c4","#3fae98"],["#a98bf5","#7a57d6"],["#ff8f8f","#e45b6b"],["#6fb6ff","#3f8be0"]];
var app=document.getElementById("app"),popped=0;
function gift(){
 app.innerHTML='<h1>A little surprise</h1><p class="sub">Something small, made just for someone special.</p><svg id="g" class="tap" viewBox="0 0 200 200" role="button" tabindex="0" aria-label="Open the gift"><g class="gift"><rect x="42" y="94" width="116" height="84" rx="8" fill="#d6559b"/><rect x="92" y="94" width="16" height="84" fill="#ffd36b"/><g class="lid"><rect x="32" y="68" width="136" height="34" rx="8" fill="#ff7eb6"/><rect x="92" y="68" width="16" height="34" fill="#ffd36b"/><path d="M100 68q-26-30-34-10q-4 14 34 10zM100 68q26-30 34-10q4 14-34 10z" fill="#ffd36b"/></g></g></svg><p class="sub" id="gc">Tap the gift to open it</p>';
 var g=document.getElementById("g"),done=false;
 function f(){if(done)return;done=true;g.classList.add("open");song();document.getElementById("gc").textContent="Here it comes…";
  var r=g.getBoundingClientRect();boom(r.left+r.width/2,r.top+r.height/2,90,null);setTimeout(pop,1300)}
 g.onclick=f;g.onkeydown=function(e){if(e.key==="Enter"||e.key===" ")f()};
}
function balloon(k){var c=cols[k];return '<button class="bl" data-k="'+k+'" aria-label="Pop balloon '+(k+1)+'"><svg viewBox="0 0 78 112"><path d="M39 78 q-6 14 2 24 q4 6 -2 10" fill="none" stroke="#9a8ab0" stroke-width="2"/><path d="M39 76 l-6 8 h12z" fill="'+c[1]+'"/><ellipse cx="39" cy="38" rx="32" ry="38" fill="'+c[0]+'"/><ellipse cx="26" cy="24" rx="8" ry="13" fill="#fff" opacity=".35" transform="rotate(20 26 24)"/></svg></button>'}
function pop(){
 popped=0;
 var b="";for(var k=0;k<6;k++)b+=balloon(k);
 app.innerHTML='<h1>Hello, birthday star</h1><p class="sub">Pop each balloon to read a wish.</p><div class="grid">'+b+'</div><div class="card wish" id="w" aria-live="polite">Tap a balloon</div><div><button class="main" id="nx" disabled>Pop all 6 first</button></div>';
 var bs=app.querySelectorAll(".bl");
 for(var j=0;j<bs.length;j++)bs[j].onclick=function(){
  var t=this,r=t.getBoundingClientRect();
  if(t.classList.contains("popped"))return;
  t.classList.add("popped");boom(r.left+r.width/2,r.top+r.height/3,40,cols[+t.dataset.k]);
  document.getElementById("w").textContent=wishes[+t.dataset.k];
  popped++;var n=document.getElementById("nx");
  if(popped===6){n.disabled=false;n.textContent="See something pretty"}else n.textContent="Pop "+(6-popped)+" more"};
 document.getElementById("nx").onclick=function(){if(popped===6)photos()};
}
function photos(){
 var h="";for(var k=0;k<4;k++)h+='<figure class="pol" style="--r:'+tilt[k]+';margin:0"><img src="'+P[k]+'" alt="" style="object-position:'+pos[k]+'">'+caps[k]+'</figure>';
 app.innerHTML='<h1>Pretty as a picture</h1><p class="sub">A few of my favourite moments of you.</p><div class="walls">'+h+'</div><div><button class="main" id="nx">One last surprise</button></div>';
 document.getElementById("nx").onclick=finale;
}
function finale(){
 app.innerHTML='<img class="ring" src="'+P[0]+'" alt=""><h1>Happy Birthday!</h1><svg id="cake" class="tap" viewBox="0 0 200 200" style="width:210px;height:210px;margin-top:0" role="button" tabindex="0" aria-label="Blow out the candle"><rect x="40" y="110" width="120" height="70" rx="10" fill="#ff7eb6"/><rect x="40" y="110" width="120" height="18" rx="9" fill="#fff"/><path d="M52 128q8 14 16 0q8 14 16 0q8 14 16 0q8 14 16 0q8 14 16 0" fill="#fff"/><circle cx="70" cy="152" r="5" fill="#ffd36b"/><circle cx="100" cy="158" r="5" fill="#a98bf5"/><circle cx="130" cy="152" r="5" fill="#7ed6c4"/><rect x="96" y="66" width="8" height="44" rx="3" fill="#ffd36b"/><g class="flame"><path d="M100 30q-14 18 0 32q14-14 0-32z" fill="#ff9d2e"/><path d="M100 42q-6 9 0 16q6-7 0-16z" fill="#ffe27a"/></g></svg><p class="sub" id="cap">Tap the candle and make a wish</p><div class="card" id="fin" style="display:none"><p style="font-size:19px;line-height:1.6;font-weight:800">I hope this year gives you everything your heart is quietly asking for. You deserve all of it, and more.</p><p class="sub" style="margin-top:12px">With love, your friend</p></div><div><button class="main" id="re" style="display:none">Replay</button></div>';
 var ck=document.getElementById("cake");song();
 function f(){if(ck.classList.contains("off"))return;ck.classList.add("off");document.getElementById("cap").style.display="none";document.getElementById("fin").style.display="block";document.getElementById("re").style.display="inline-block";
  for(var q=0;q<4;q++)setTimeout(function(){boom(innerWidth*(.2+Math.random()*.6),innerHeight*.4,70,null)},q*350)}
 ck.onclick=f;ck.onkeydown=function(e){if(e.key==="Enter"||e.key===" ")f()};
 document.getElementById("re").onclick=gift;
}
var AC=null,master=null,cur=null,muted=false;
var tune=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2.4]];
function song(){
 try{
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination)}
  if(AC.state==="suspended")AC.resume();
  if(cur){cur.gain.cancelScheduledValues(AC.currentTime);cur.gain.setTargetAtTime(0,AC.currentTime,.05)}
  var bus=AC.createGain();bus.connect(master);cur=bus;
  var t=AC.currentTime+.15,b=.55;
  tune.forEach(function(n){
   var d=n[1]*b,o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();
   o.type="triangle";o.frequency.value=n[0];o2.type="sine";o2.frequency.value=n[0]/2;
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d*.97);
   o.connect(g);o2.connect(g);g.connect(bus);
   o.start(t);o2.start(t);o.stop(t+d);o2.stop(t+d);t+=d});
 }catch(e){}
}
document.getElementById("mu").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊";if(master)master.gain.value=muted?0:.5};
var cv=document.getElementById("cv"),cx=cv.getContext("2d"),ps=[],run=false,mix=["#ff7eb6","#ffd36b","#7ed6c4","#a98bf5","#6fb6ff","#ff9d2e"];
function boom(x,y,n,c){
 cv.width=innerWidth;cv.height=innerHeight;
 for(var k=0;k<n;k++)ps.push({x:x,y:y,vx:(Math.random()-.5)*12,vy:-Math.random()*11-2,r:Math.random()*5+3,c:c?c[k%2]:mix[k%6],a:Math.random()*6});
 if(!run){run=true;tick()}
}
function tick(){
 cx.clearRect(0,0,cv.width,cv.height);
 ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.99;p.a+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
 ps=ps.filter(function(p){return p.y<cv.height+20});
 if(ps.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}
gift();
